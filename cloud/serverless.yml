service: riven-stock-cloud

frameworkVersion: "3"

useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  profile: cuenta_personal
  memorySize: 256
  timeout: 10
  environment:
    MONGODB_URI: ${env:MONGODB_URI}
    FEEDBACK_BUCKET: riven-stock-feedback-${aws:accountId}
  tags:
    project: riven-stock
  iam:
    role:
      statements:
        # Los reportes de bugs guardan capturas y logs en el bucket privado de feedback (solo escritura).
        - Effect: Allow
          Action: s3:PutObject
          Resource: arn:aws:s3:::riven-stock-feedback-${aws:accountId}/*
        # El colector se relanza a sí mismo si le quedan armas pendientes al agotar su tiempo.
        - Effect: Allow
          Action: lambda:InvokeFunction
          Resource: arn:aws:lambda:us-east-1:*:function:riven-stock-collector

package:
  patterns:
    - "!.env"

functions:
  collector:
    name: riven-stock-collector
    handler: src/collector.handler
    timeout: 900
    events:
      - schedule:
          # 06:00 UTC todos los días (03:00 en Argentina)
          rate: cron(0 6 * * ? *)
      - schedule:
          # Segunda pasada: completa las armas que fallaron por límite de la API (el colector retoma lo que falta)
          rate: cron(30 6 * * ? *)
  api:
    name: riven-stock-api
    handler: src/api.handler
    # Tope de ejecuciones simultáneas: hace de límite de uso de la API pública.
    reservedConcurrency: 5
    url:
      cors: true
  backup:
    name: riven-stock-backup
    handler: src/backup.handler
    reservedConcurrency: 5
    url:
      cors: true
  feedback:
    name: riven-stock-feedback
    handler: src/feedback.handler
    memorySize: 256
    timeout: 20
    reservedConcurrency: 3
    url:
      cors: true

resources:
  Resources:
    FeedbackBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: riven-stock-feedback-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        LifecycleConfiguration:
          Rules:
            - Id: borrar-a-los-180-dias
              Status: Enabled
              ExpirationInDays: 180
        Tags:
          - Key: project
            Value: riven-stock
