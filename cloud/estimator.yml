AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Calibración nocturna del estimador de Riven Stock (pedido de Fran, 2026-10-31).
  Una Lambda corre una vez por día: mide el error del estimado contra las ventas
  reales, se autovalida y publica sólo los niveles de corrección que mejoran,
  en un archivo público de S3 que baja la app.
  Una segunda Lambda (2026-11-02) regenera los datos de armas y el modelo
  caro/barato (weapon_data.json), para que un arma nueva no obligue a sacar versión.
  Una tercera (2026-11-04) entrena el modelo de precio con las ventas (price_model.json).

Parameters:
  MongoUri:
    Type: String
    NoEcho: true
    Description: Cadena de conexión de MongoDB Atlas (la misma del colector).
  Schedule:
    Type: String
    Default: "cron(0 7 * * ? *)"
    Description: 07:00 UTC, que para Fran son las 04:00 de Argentina.
  WeaponDataSchedule:
    Type: String
    Default: "cron(30 6 * * ? *)"
    Description: Media hora antes de la calibración, que mide con estos datos.
  PriceModelSchedule:
    Type: String
    Default: "cron(30 7 * * ? *)"
    Description: Después de los datos de armas y de la calibración, para no competir por Mongo.
  CodeBucket:
    Type: String
    Description: Bucket donde vive el zip (lo sube tools/build_estimator_lambda.py).
  CodeKey:
    Type: String
    Default: estimator.zip

Resources:
  # Sólo factors.json, weapon_data.json y price_model.json son públicos: sin listado y sin poder escribir. La app no tiene
  # credenciales y lo que se sirve son números, así que una URL pública alcanza.
  Publico:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub riven-stock-estimator-public-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  PublicoLectura:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Publico
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource:
              - !Sub ${Publico.Arn}/factors.json
              - !Sub ${Publico.Arn}/weapon_data.json
              - !Sub ${Publico.Arn}/price_model.json

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/riven-stock-estimator
      RetentionInDays: 14

  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: riven-stock-estimator-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: publicar-factores
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub ${Publico.Arn}/factors.json
                  - !Sub ${Publico.Arn}/weapon_data.json
                  - !Sub ${Publico.Arn}/price_model.json

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: riven-stock-estimator
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt Role.Arn
      # 12 mil ventas con su mercado tardan unos 6 minutos: 15 es el techo de Lambda.
      Timeout: 900
      MemorySize: 1024
      Environment:
        Variables:
          # La conexión va por campo de la función (como en el colector); NoEcho evita
          # que quede en el texto del stack.
          MONGODB_URI: !Ref MongoUri
          ESTIMATOR_BUCKET: !Ref Publico
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey

  CadaDia:
    Type: AWS::Events::Rule
    Properties:
      Name: riven-stock-estimator-diario
      ScheduleExpression: !Ref Schedule
      State: ENABLED
      Targets:
        - Id: estimador
          Arn: !GetAtt Function.Arn

  PermisoEventos:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CadaDia.Arn

  ArmasLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/riven-stock-weapon-data
      RetentionInDays: 14

  # Mismo zip y mismo rol: sólo cambia el handler (tools/weapon_data_job.py).
  ArmasFunction:
    Type: AWS::Lambda::Function
    DependsOn: ArmasLogGroup
    Properties:
      FunctionName: riven-stock-weapon-data
      Runtime: python3.12
      Handler: handler.handler_armas
      Role: !GetAtt Role.Arn
      # Hoy tarda segundos (65 mil ventas); el margen es para cuando crezca.
      Timeout: 900
      MemorySize: 1024
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoUri
          ESTIMATOR_BUCKET: !Ref Publico
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey

  ArmasCadaDia:
    Type: AWS::Events::Rule
    Properties:
      Name: riven-stock-weapon-data-diario
      ScheduleExpression: !Ref WeaponDataSchedule
      State: ENABLED
      Targets:
        - Id: armas
          Arn: !GetAtt ArmasFunction.Arn

  ArmasPermisoEventos:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ArmasFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ArmasCadaDia.Arn

  ModeloLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/riven-stock-price-model
      RetentionInDays: 14

  # Mismo zip y mismo rol (tools/price_model_job.py). Entrenar con ~60 días de ventas pide
  # memoria y CPU: con 3008 MB Lambda da dos núcleos.
  ModeloFunction:
    Type: AWS::Lambda::Function
    DependsOn: ModeloLogGroup
    Properties:
      FunctionName: riven-stock-price-model
      Runtime: python3.12
      Handler: handler.handler_modelo
      Role: !GetAtt Role.Arn
      Timeout: 900
      MemorySize: 3008
      EphemeralStorage:
        Size: 1024
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoUri
          ESTIMATOR_BUCKET: !Ref Publico
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey

  ModeloCadaDia:
    Type: AWS::Events::Rule
    Properties:
      Name: riven-stock-price-model-diario
      ScheduleExpression: !Ref PriceModelSchedule
      State: ENABLED
      Targets:
        - Id: modelo
          Arn: !GetAtt ModeloFunction.Arn

  ModeloPermisoEventos:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ModeloFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ModeloCadaDia.Arn

Outputs:
  EstimatorUrl:
    Description: URL pública de los factores (la usa la app)
    Value: !Sub https://${Publico}.s3.${AWS::Region}.amazonaws.com/factors.json
  FunctionName:
    Value: !Ref Function
  WeaponDataUrl:
    Description: URL pública de los datos de armas (la usa la app)
    Value: !Sub https://${Publico}.s3.${AWS::Region}.amazonaws.com/weapon_data.json
  WeaponDataFunctionName:
    Value: !Ref ArmasFunction
  PriceModelUrl:
    Description: URL pública del modelo de precio (la usa la app)
    Value: !Sub https://${Publico}.s3.${AWS::Region}.amazonaws.com/price_model.json
  PriceModelFunctionName:
    Value: !Ref ModeloFunction
