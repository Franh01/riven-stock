  .btn:hover { transform:translateY(-2px); box-shadow:0 16px 36px -8px rgba(139,107,255,.85), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn svg { width:20px; height:20px; }
  .meta { margin-top:14px; color:var(--muted); font-size:13.5px; display:flex; gap:16px; flex-wrap:wrap; }

  .ss-grid .car { margin:0; width:100%; }
  .ss-text h2 { margin-top:0; }
  @media (max-width:860px) { .ss-grid { grid-template-columns:1fr; gap:20px; } .ss-grid .car { max-width:380px; margin:0 auto; } }
  .car { max-width:380px; margin:28px auto; padding:14px 14px 16px; background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:0 30px 80px -30px rgba(0,0,0,.8); }
  .car-view { position:relative; overflow:hidden; border-radius:12px; }
  .car-track { display:flex; transition:transform .45s cubic-bezier(.4,.1,.2,1); }
  .car-slide { flex:0 0 100%; min-width:0; }
  .car-slide .shot { box-shadow:none; border-radius:12px; }
  .car-slide p { margin:14px 6px 0; text-align:center; font-size:15px; line-height:1.5; min-height:46px; }
  .car-slide p::before { content:attr(data-n); display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; margin-right:8px; border-radius:50%; background:var(--accent); color:#fff; font-size:12px; font-weight:700; vertical-align:1px; }
  .car-arrow { position:absolute; top:50%; transform:translateY(-50%); width:38px; height:38px; border-radius:50%; border:1px solid rgba(255,255,255,.25); background:rgba(10,12,24,.6); backdrop-filter:blur(6px); color:#fff; font-size:24px; line-height:1; padding:0 0 3px; cursor:pointer; z-index:2; opacity:.85; transition:background .2s, transform .2s, opacity .2s; }
  .car-arrow:hover { background:var(--accent); opacity:1; transform:translateY(-50%) scale(1.08); }
  .car-prev { left:10px; } .car-next { right:10px; }
  .car-nav { display:flex; gap:8px; justify-content:center; margin-top:12px; }
  .car-nav button { width:8px; height:8px; border-radius:99px; border:0; padding:0; background:rgba(255,255,255,.25); cursor:pointer; transition:width .3s, background .3s; }

  .mock { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 30px 80px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.03); overflow:hidden; transform:perspective(1200px) rotateY(-6deg) rotateX(2deg); }
  .mock-bar { display:flex; gap:7px; padding:12px 14px; background:var(--bg2); border-bottom:1px solid var(--line); }
  .mock-bar b { width:11px; height:11px; border-radius:50%; background:#2b3345; }
  .mock-body { padding:16px; display:grid; gap:10px; }
  .row { display:grid; grid-template-columns: 1.6fr .8fr .6fr; gap:10px; align-items:center; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:13px; }
  .row small { color:var(--muted); display:block; font-size:11.5px; }
  .row .pr { font-weight:700; color:var(--accent2); text-align:right; }

  .tag.w { background:rgba(240,182,74,.12); color:var(--warn); }

  section { padding: 40px 0; }
  .eyebrow { color:var(--accent2); font-size:13px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }
  h2 { font-size: clamp(26px, 3.4vw, 36px); line-height:1.2; margin: 10px 0 14px; letter-spacing:-.5px; }
  .sub { color:#b9c1d3; max-width:640px; margin:0 0 28px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .feat { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; transition:border-color .2s, transform .2s; }
  .feat:hover { border-color:rgba(139,107,255,.5); transform:translateY(-3px); }
  .ico { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:rgba(139,107,255,.14); font-size:20px; margin-bottom:12px; }
  .feat h3 { margin:0 0 6px; font-size:17px; } .feat p { margin:0; color:var(--muted); font-size:14.5px; }

  .steps { counter-reset:s; display:grid; gap:12px; padding:0; margin:0; list-style:none; }
  .steps li { counter-increment:s; position:relative; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px 16px 62px; color:#cfd5e2; }
  .steps li::before { content:counter(s); position:absolute; left:16px; top:14px; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:14px; background:linear-gradient(135deg,#8b6bff,#6a4df0); color:#fff; }
  code, kbd { background:#0a0c12; border:1px solid var(--line); border-radius:6px; padding:1px 7px; font:13.5px ui-monospace,Consolas,monospace; color:var(--accent2); }
  a { color:var(--accent2); }
  .note { color:var(--muted); font-size:14px; margin-top:16px; }
  .warn { margin-top:22px; border:1px solid rgba(255,90,90,.6); border-left:5px solid #ff4d4d; background:rgba(255,77,77,.1); border-radius:14px; padding:16px 20px 16px 52px; color:#ffd9d9; position:relative; box-shadow:0 0 0 1px rgba(255,77,77,.12), 0 12px 32px -14px rgba(255,77,77,.5); }
  .warn::before { content:"!"; position:absolute; left:16px; top:16px; width:24px; height:24px; border-radius:50%; background:#ff4d4d; color:#fff; font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; }
  .warn-top { margin:0 0 8px; }
  .warn strong { display:block; color:#ff7b7b; font-size:17px; margin-bottom:4px; }

  .trust { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .t { text-align:center; padding:20px 12px; background:var(--card); border:1px solid var(--line); border-radius:14px; }

<script>
(function(){var c=document.getElementById('ssCar');if(!c)return;var tr=c.querySelector('.car-track'),n=c.querySelectorAll('.car-slide').length,bt=c.querySelectorAll('.car-nav button'),i=0;
function go(k){i=(k+n)%n;tr.style.transform='translateX('+(-100*i)+'%)';bt.forEach(function(e,j){e.classList.toggle('on',j===i)})}
bt.forEach(function(b,k){b.onclick=function(){go(k)}});
c.querySelector('.car-prev').onclick=function(){go(i-1)};c.querySelector('.car-next').onclick=function(){go(i+1)};go(0);})();
</script>

let lang = localStorage.getItem("lang") || ((navigator.language || "es").slice(0, 2) === "en" ? "en" : "es");
let ver = "";
function apply() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = T[lang][e.dataset.i18n]);
  document.querySelectorAll("[data-i18n-html]").forEach(e => e.innerHTML = T[lang][e.dataset.i18nHtml]);
  document.getElementById("l-es").classList.toggle("on", lang === "es");
  document.getElementById("l-en").classList.toggle("on", lang === "en");
  document.getElementById("dl-info").textContent = ver ? T[lang].info.replace("{v}", ver) : T[lang].info0;
}
document.getElementById("l-es").onclick = () => { lang = "es"; localStorage.setItem("lang", lang); apply(); };
document.getElementById("l-en").onclick = () => { lang = "en"; localStorage.setItem("lang", lang); apply(); };
apply();
// Link directo al instalador de la última versión; sin release todavía queda la página de releases.
fetch("https://api.github.com/repos/Franh01/riven-stock/releases/latest").then(r => r.json()).then(rel => {
  const a = (rel.assets || []).find(x => x.name.endsWith("-Setup.exe"));
  if (a) { document.getElementById("dl").href = a.browser_download_url; ver = rel.tag_name.replace(/^v/, ""); apply(); }
}).catch(() => {});
</script>
