name: CI Windows

# Cada push y cada PR: tests, chequeo del JS, build del exe + instalador y prueba de humo del exe.
# release.py se niega a publicar un commit cuyo CI no esté en verde.
# Un tag vX.Y.Z (lo pushea release.py) además publica el release: zip, instalador, sha256 y notas.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write   # gh release create en los tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Chequeo del JS de la interfaz
        run: python tools/check_js.py

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build del exe y el instalador
        run: python tools/build_exe.py

      - name: Prueba de humo del exe
        run: python tools/smoke_exe.py build/dist/RivenStock/RivenStock.exe

      - name: Publicar el release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          python tools/release.py --ci "$ver"
          gh release create "$GITHUB_REF_NAME" \
            "dist/riven-stock-v$ver.zip" "dist/riven-stock-v$ver.zip.sha256" \
            "dist/RivenStock-v$ver-Setup.exe" "dist/RivenStock-v$ver-Setup.exe.sha256" \
            --title "Riven Stock $ver" --notes-file dist/notas.md

      - name: Guardar instalador y log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riven-stock-windows
          path: |
            dist/*.exe
            dist/*.sha256
            ${{ runner.temp }}/rs-smoke/riven-stock.log
          if-no-files-found: warn
          retention-days: 14
