<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Riven Stock</title>
<style>
  :root {
    --bg: #0c0518;
    --panel: #160b2a;
    --panel-2: #1e1038;
    --line: #2f1d52;
    --text: #ece4ff;
    --muted: #9a8cba;
    --accent: #a066f6;
    --accent-2: #c99bff;
    --pos: #7ee2a8;
    --neg: #ff8a9a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, #2a1450 0%, var(--bg) 60%);
    color: var(--text);
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 28px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font: 600 19px "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: .3px; }
  header p { margin: 0; color: var(--muted); font-size: 12px; }
  main { flex: 1; overflow: auto; padding: 24px 28px 110px; display: grid; gap: 20px; align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
  input, select, button { font: inherit; color: var(--text); }
  input, select {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 11px; outline: none; width: 100%;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #a066f633; }
  input:disabled, select:disabled { opacity: .5; }
  button {
    background: linear-gradient(180deg, #b47cff, #7b3fe4); border: 0; border-radius: 9px;
    padding: 10px 20px; font-weight: 600; cursor: pointer; white-space: nowrap;
    box-shadow: 0 4px 16px #7b3fe455;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { filter: grayscale(.6); opacity: .6; cursor: default; }
  button.ghost { background: var(--panel-2); border: 1px solid var(--line); box-shadow: none; padding: 6px 12px; font-weight: 500; font-size: 13px; }
  button.ghost:hover { border-color: var(--accent); }
  button.danger { background: none; border: 1px solid #e5546b66; color: var(--neg); box-shadow: none; padding: 6px 12px; font-weight: 500; font-size: 13px; }
  button.danger:hover { background: #e5546b1a; }
  button.solid-danger { background: linear-gradient(180deg, #f06a80, #c43a52); box-shadow: 0 4px 16px #c43a5255; }
  button.icon { background: none; box-shadow: none; padding: 4px 10px; color: var(--muted); font-size: 20px; line-height: 1; }
  button.icon:hover { color: var(--text); }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid #241540; vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr.hidden-row td:not(.actions) { opacity: .62; }
  td.price { font-weight: 700; color: var(--accent-2); font-size: 16px; white-space: nowrap; }
  .price-edit { display: inline-flex; align-items: center; cursor: text; border-radius: 6px; padding: 2px 6px; margin: -2px -6px; }
  .price-edit:hover { background: var(--panel-2); }
  .price-input { width: 84px; padding: 4px 8px; font-weight: 700; color: var(--accent-2); }
  .riven-weapon { font-weight: 600; }
  .riven-name { text-transform: capitalize; color: var(--muted); font-size: 12px; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px; }
  .stat { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #7ee2a81a; color: var(--pos); white-space: nowrap; }
  .stat.neg { background: #ff8a9a1a; color: var(--neg); }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .badge.on { background: #7ee2a81f; color: var(--pos); }
  .badge.off { background: #9a8cba22; color: var(--muted); }
  td.actions { white-space: nowrap; text-align: right; }
  td.actions button + button { margin-left: 6px; }
  .muted { color: var(--muted); }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .state { color: var(--muted); padding: 24px 0; text-align: center; }
  .error { color: var(--neg); }

  /* Botón flotante */
  .fab {
    position: fixed; right: 28px; bottom: 28px; z-index: 5;
    display: flex; align-items: center; gap: 10px;
    padding: 14px 22px 14px 18px; border-radius: 99px; font-size: 15px;
    box-shadow: 0 10px 34px #7b3fe488, 0 0 0 1px #c99bff44 inset;
  }
  .fab span { font-size: 22px; line-height: 1; font-weight: 400; }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); z-index: 20;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 18px; opacity: 0; transition: .2s; pointer-events: none; box-shadow: 0 8px 30px #0008;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .toast.error { border-color: #e5546b88; }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 16px;
    padding: 0; box-shadow: 0 20px 60px #000a;
  }
  dialog::backdrop { background: #05020bcc; }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid var(--line); }
  .dlg-head h3 { margin: 0; font-size: 17px; }
  .dlg-body { padding: 20px 24px 24px; display: grid; gap: 22px; }
  dialog p { margin: 0 0 16px; color: var(--muted); }

  #close-dialog { width: min(460px, 90vw); }
  .sold { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .sold input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  .sold input[type=number] { width: 110px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; }

  #riven-dialog { width: min(1040px, 94vw); max-height: 92vh; }
  #riven-dialog .dlg-body { overflow: auto; max-height: calc(92vh - 64px); }
  .section-title { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .step { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: #a066f633; color: var(--accent-2); }
  .grid-riven { display: grid; grid-template-columns: 2fr 1.4fr 1.1fr .7fr .7fr .7fr; gap: 12px; }
  .grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
  .stat-slot { display: grid; gap: 6px; }
  .stat-slot .row { display: grid; grid-template-columns: 1fr 88px; gap: 6px; }
  .stat-slot .tag { font-size: 12px; color: var(--muted); }
  .stat-slot .tag.neg { color: var(--neg); }
  .unit { position: relative; }
  .unit input { padding-right: 24px; }
  .unit::after { content: attr(data-unit); position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; pointer-events: none; }
  .row-actions { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  .hint { color: var(--muted); font-size: 12px; }
  .summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; min-width: 110px; text-align: left; box-shadow: none; font-weight: 400; }
  .chip b { display: block; font-size: 20px; font-weight: 600; color: var(--accent-2); }
  .chip span { color: var(--muted); font-size: 12px; }
  button.chip:hover { border-color: var(--accent); filter: none; }
  .ref-table td { padding: 7px 10px; font-size: 13px; }
  .ref-table td.price { font-size: 14px; }
  .ref-table td:nth-child(2), .ref-table td:nth-child(4), .ref-table td:nth-child(5) { white-space: nowrap; }
  .publish { display: grid; grid-template-columns: 140px auto 1fr auto; gap: 14px; align-items: end; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; padding-bottom: 10px; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }
  .confirm { background: #a066f614; border: 1px solid #a066f655; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 14px; }
  .confirm[hidden] { display: none; }
  [hidden] { display: none !important; }

  /* Selector con autocompletado */
  .combo { position: relative; }
  .combo-list {
    position: absolute; z-index: 30; left: 0; min-width: max(100%, 270px); top: calc(100% + 4px);
    max-height: 264px; overflow: auto; padding: 4px;
    background: #1b0e33; border: 1px solid var(--accent); border-radius: 10px; box-shadow: 0 12px 34px #000b;
  }
  .combo-item { display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; border-radius: 7px; cursor: pointer; color: var(--text); font-size: 13px; }
  .combo-item small { color: var(--muted); }
  .combo-item mark { background: none; color: var(--accent-2); font-weight: 700; }
  .combo-item.active { background: #a066f633; }
  .combo-item.selected { color: var(--accent-2); }
  .combo-empty { padding: 8px 10px; color: var(--muted); font-size: 13px; }

  button.sold-btn { background: none; border: 1px solid #7ee2a866; color: var(--pos); box-shadow: none; padding: 6px 12px; font-weight: 500; font-size: 13px; }
  button.sold-btn:hover { background: #7ee2a81a; }
  button.solid-sold { background: linear-gradient(180deg, #5fd497, #2f9e66); box-shadow: 0 4px 16px #2f9e6655; }
  .spinner {
    display: inline-block; width: 13px; height: 13px; margin-left: 8px; vertical-align: -2px;
    border: 2px solid #c99bff44; border-top-color: var(--accent-2); border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  tr.busy td:not(.actions) { opacity: .7; }
  td:has(> .badge) { white-space: nowrap; }
  tr.busy .price-edit { cursor: default; }
  tr.busy .price-edit:hover { background: none; }
  .ref-note { margin-top: 10px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <svg width="36" height="36" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#eed6ff"/><stop offset=".45" stop-color="#a05cf6"/><stop offset="1" stop-color="#421696"/>
      </linearGradient>
    </defs>
    <rect width="100" height="100" rx="20" fill="#1a0b33"/>
    <path d="M48 12 L45.5 29 L51.5 44 L44 59 L50 75 L48 88 L23 50 Z" fill="url(#g)"/>
    <path d="M53 10 L50.5 27 L56.5 42 L49 57 L55 73 L53 86 L78 48 Z" fill="url(#g)"/>
  </svg>
  <div>
    <h1>Riven Stock</h1>
    <p>Ventas directas en warframe.market</p>
  </div>
</header>

<main>
  <section class="card">
    <div class="card-head">
      <h2 id="mine-title">Mis ventas directas</h2>
      <button class="ghost" id="reload">Actualizar</button>
    </div>
    <div id="mine"><div class="state">Cargando…</div></div>
  </section>
  <section class="card" id="closed-card" hidden>
    <div class="card-head"><h2>Cerrados desde la app</h2></div>
    <div id="closed"></div>
  </section>
</main>

<button class="fab" id="fab" title="Precio de referencia y nuevo contrato"><span>+</span> Nuevo riven</button>

<!-- Modal: riven → referencia → publicar / actualizar precio -->
<dialog id="riven-dialog">
  <div class="dlg-head">
    <h3 id="rd-title">Nuevo riven</h3>
    <button class="icon" id="rd-x" title="Cerrar">×</button>
  </div>
  <div class="dlg-body">
    <section>
      <div class="section-title"><span class="step">1</span><h2>Riven</h2></div>
      <div class="grid-riven">
        <label>Arma <input id="f-weapon" placeholder="Escribí el arma…"></label>
        <label>Nombre <input id="f-name" placeholder="Ej. Crita-acritis"></label>
        <label>Polaridad
          <select id="f-polarity"><option value="madurai">Madurai</option><option value="naramon">Naramon</option><option value="vazarin">Vazarin</option></select>
        </label>
        <label>MR <input id="f-mr" type="number" min="8" max="16" value="8"></label>
        <label>Rango <input id="f-rank" type="number" min="0" max="8" value="0"></label>
        <label>Rolls <input id="f-rolls" type="number" min="0" value="0"></label>
      </div>
      <div class="grid-stats" id="stat-slots"></div>
      <div class="row-actions">
        <button id="ref-go">Ver precio de referencia</button>
        <span class="hint" id="rd-info">Para la referencia alcanza con el arma. Los stats y valores (tal como aparecen en el juego) son para publicar.</span>
      </div>
    </section>

    <section id="ref-section" hidden>
      <div class="section-title"><span class="step">2</span><h2 id="ref-title">Referencia</h2></div>
      <div class="summary" id="summary"></div>
      <div id="results"></div>
      <div class="ref-note" id="ref-note"></div>
    </section>

    <section id="publish-section">
      <div class="section-title"><span class="step" id="publish-step">2</span><h2 id="publish-title">Publicar venta directa</h2></div>
      <div class="publish">
        <label>Precio <div class="unit" data-unit="p"><input id="f-price" type="number" min="1"></div></label>
        <label class="check" id="f-visible-wrap"><input type="checkbox" id="f-visible" checked> Visible</label>
        <label id="f-note-wrap">Nota (opcional) <input id="f-note" placeholder="Ej. Open to offers, PM me"></label>
        <button id="publish-go">Publicar</button>
      </div>
      <div class="confirm" id="confirm" hidden>
        <span id="confirm-text"></span>
        <div style="display:flex; gap:10px">
          <button class="ghost" id="confirm-back">Volver</button>
          <button id="confirm-ok">Confirmar</button>
        </div>
      </div>
    </section>
  </div>
</dialog>

<dialog id="close-dialog">
  <form method="dialog" style="padding: 24px">
    <h3 style="margin: 0 0 10px; font-size: 17px" id="cd-title">Cerrar contrato</h3>
    <p id="close-text"></p>
    <div class="sold" id="sold-row">
      <label for="sold-price" style="display:inline; color: var(--text); font-size: 14px;">Vendido por</label>
      <input type="number" id="sold-price" min="1">
      <span class="muted">p</span>
    </div>
    <div class="dialog-actions">
      <button class="ghost" value="cancel">Cancelar</button>
      <button value="ok" id="cd-ok">Cerrar contrato</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
  let catalog = { weapons: [], stats: [] };
  const statBySlug = {}, weaponBySlug = {};
  let mine = [];
  let editing = null;   // contrato existente abierto en el modal, o null si es un riven nuevo
  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const api = () => window.pywebview.api;
  const UNIT = { percent: "%", multiply: "x", seconds: "s" };

  function toast(msg, isError = false) {
    const t = $("#toast");
    t.textContent = msg; t.classList.toggle("error", isError); t.classList.add("show");
    clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove("show"), isError ? 6000 : 2500);
  }

  const weaponName = (slug) => weaponBySlug[slug]?.name ?? slug.replace(/_/g, " ");

  function formatStat(st) {
    const meta = statBySlug[st.slug];
    const v = st.value, sign = v > 0 ? "+" : "";
    const val = meta?.unit === "multiply" ? `x${v}` : `${sign}${v}${UNIT[meta?.unit] ?? ""}`;
    return `<span class="stat ${st.positive ? "" : "neg"}">${esc(val)} ${esc(meta?.name ?? st.slug)}</span>`;
  }

  const rivenLabel = (a) => `${esc(weaponName(a.weapon))} <span style="text-transform:capitalize">${esc(a.name)}</span>`;

  // ---- Mis contratos ---------------------------------------------------

  // La interfaz es optimista: cada acción se ve al instante y la fila queda "pendiente"
  // (spinner, botones bloqueados) hasta que responde la API. Si falla, se revierte.
  let closed = [];
  const pending = new Set();   // ids de contratos con un pedido en curso

  async function loadMine() {
    $("#reload").disabled = true;
    try {
      const data = await api().my_auctions();
      if (data.error) { $("#mine").innerHTML = `<div class="state error">${esc(data.error)}</div>`; return; }
      mine = data.auctions;
      closed = data.closed;
      renderMine();
      renderClosed();
    } finally {
      $("#reload").disabled = false;
    }
  }

  const spinner = `<span class="spinner" title="Esperando a warframe.market…"></span>`;

  function renderMine() {
    const visibles = mine.filter((a) => a.visible).length;
    $("#mine-title").textContent = `Mis ventas directas · ${visibles} visibles · ${mine.length - visibles} ocultas`;
    if (!mine.length) { $("#mine").innerHTML = `<div class="state">No tenés ventas directas publicadas.</div>`; return; }
    $("#mine").innerHTML = `<table>
      <thead><tr><th>Riven</th><th>Stats</th><th>Rolls</th><th>MR</th><th>Precio</th><th>Estado</th><th></th></tr></thead>
      <tbody>${mine.map((a) => {
        const busy = pending.has(a.id), off = busy ? "disabled" : "";
        return `<tr data-id="${esc(a.id)}" class="${a.visible ? "" : "hidden-row"} ${busy ? "busy" : ""}">
        <td><div class="riven-weapon">${esc(weaponName(a.weapon))}</div><div class="riven-name">${esc(a.name)}</div></td>
        <td><div class="stats">${a.stats.map(formatStat).join("")}</div></td>
        <td>${esc(a.rolls)}</td>
        <td>${esc(a.mr)}</td>
        <td class="price"><span class="price-edit" ${busy ? "" : `data-act="edit-price"`} title="Click para editar">${a.price}p</span></td>
        <td><span class="badge ${a.visible ? "on" : "off"}">${a.visible ? "Visible" : "Oculto"}</span>${busy ? spinner : ""}</td>
        <td class="actions">
          <button class="ghost" data-act="ref" title="Precio de referencia del arma">Referencia</button>
          <button class="ghost" data-act="toggle" ${off}>${a.visible ? "Ocultar" : "Mostrar"}</button>
          <button class="sold-btn" data-act="sold" ${off} title="Cerrar el contrato y registrar la venta">Vendido</button>
          <button class="danger" data-act="close" ${off} title="Cerrar sin venta">Cerrar</button>
        </td>
      </tr>`;
      }).join("")}</tbody></table>`;
  }

  function renderClosed() {
    $("#closed-card").hidden = !closed.length;
    $("#closed").innerHTML = `<table>
      <thead><tr><th>Riven</th><th>Stats</th><th>Último precio</th><th>Vendido</th><th>Cerrado</th></tr></thead>
      <tbody>${closed.map((a) => `<tr class="${a.pending ? "busy" : ""}">
        <td><div class="riven-weapon">${esc(weaponName(a.weapon))}</div><div class="riven-name">${esc(a.name)}</div></td>
        <td><div class="stats">${a.stats.map(formatStat).join("")}</div></td>
        <td>${a.price}p</td>
        <td>${a.sold_price ? `<b style="color: var(--pos)">${a.sold_price}p</b>` : `<span class="muted">No</span>`}</td>
        <td class="muted">${a.pending
          ? `${spinner} Cerrando…`
          : esc(new Date(a.closed_at).toLocaleString("es-AR", { dateStyle: "short", timeStyle: "short" }))}</td>
      </tr>`).join("")}</tbody></table>`;
  }

  // Cambio de precio y/o visibilidad: se aplica en pantalla ya, y se confirma (o revierte) después.
  async function runUpdate(a, changes, okMsg) {
    const before = a;
    mine = mine.map((x) => (x.id === a.id ? { ...x, ...changes } : x));
    pending.add(a.id);
    renderMine();
    const res = await api().update(a.id, changes.price ?? null, changes.visible ?? null);
    pending.delete(a.id);
    mine = mine.map((x) => (x.id === a.id ? (res.error ? before : res.auction) : x));
    renderMine();
    if (res.error) toast(`No se pudo guardar: ${res.error}`, true);
    else toast(okMsg);
  }

  // Cerrar (con o sin venta): la fila pasa a "Cerrados" ya, con "Cerrando…" hasta que confirma.
  async function runClose(a, soldPrice) {
    const index = mine.findIndex((x) => x.id === a.id);
    const entry = { ...a, sold_price: soldPrice, closed_at: new Date().toISOString(), pending: true };
    mine = mine.filter((x) => x.id !== a.id);
    closed = [entry, ...closed];
    renderMine(); renderClosed();
    const res = await api().close(a.id, soldPrice);
    if (res.error) {
      closed = closed.filter((x) => x !== entry);
      mine.splice(index, 0, a);
      renderMine(); renderClosed();
      toast(`No se pudo cerrar: ${res.error}`, true);
      return;
    }
    entry.pending = false;
    entry.closed_at = res.closed_at;
    renderClosed();
    toast(soldPrice ? `Vendido por ${soldPrice}p` : "Contrato cerrado");
  }

  function editPrice(span, a) {
    span.outerHTML = `<input type="number" min="1" value="${a.price}" class="price-input">`;
    const input = document.querySelector(`tr[data-id="${a.id}"] .price-input`);
    input.focus(); input.select();
    let done = false;
    const finish = (save) => {
      if (done) return; done = true;
      const price = parseInt(input.value, 10);
      if (!save || !price || price === a.price) { renderMine(); return; }
      runUpdate(a, { price }, `Precio actualizado: ${a.price}p → ${price}p`);
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); });
    input.addEventListener("blur", () => finish(false));
  }

  // Vendido y Cerrar usan el mismo diálogo: los dos cierran el contrato en warframe.market;
  // Vendido además registra el precio de venta.
  function askClose(a, sold) {
    const dlg = $("#close-dialog");
    $("#cd-title").textContent = sold ? "Marcar como vendido" : "Cerrar contrato";
    $("#close-text").innerHTML = `${rivenLabel(a)} · ${a.price}p.<br>` + (sold
      ? `Se cierra el contrato en warframe.market y la venta queda registrada en la app.`
      : `Se cierra sin registrar venta. Desaparece de warframe.market y no se puede deshacer.`);
    $("#sold-row").hidden = !sold;
    $("#sold-price").value = a.price;
    $("#cd-ok").textContent = sold ? "Vendido" : "Cerrar contrato";
    $("#cd-ok").className = sold ? "solid-sold" : "solid-danger";
    dlg.returnValue = "";
    dlg.showModal();
    if (sold) { $("#sold-price").focus(); $("#sold-price").select(); }
    dlg.onclose = () => {
      if (dlg.returnValue !== "ok") return;
      runClose(a, sold ? parseInt($("#sold-price").value, 10) || null : null);
    };
  }

  // Enter en el precio confirma (sin esto, el form tomaría "Cancelar", que es el primer botón).
  $("#sold-price").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    $("#close-dialog").close("ok");
  });

  $("#mine").addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el || el.disabled) return;
    const a = mine.find((x) => x.id === el.closest("tr").dataset.id);
    if (!a) return;
    const act = el.dataset.act;
    if (act === "ref") return openRiven(a);
    if (pending.has(a.id)) return;
    if (act === "edit-price") editPrice(el, a);
    if (act === "toggle") runUpdate(a, { visible: !a.visible }, a.visible ? "Contrato oculto" : "Contrato visible");
    if (act === "close") askClose(a, false);
    if (act === "sold") askClose(a, true);
  });
  $("#reload").addEventListener("click", loadMine);

  // ---- Modal: riven → referencia → publicar ------------------------------

  const SLOTS = [
    { label: "Positivo 1", positive: true }, { label: "Positivo 2", positive: true },
    { label: "Positivo 3 (opcional)", positive: true }, { label: "Negativo (opcional)", positive: false },
  ];
  $("#stat-slots").innerHTML = SLOTS.map((s, i) => `
    <div class="stat-slot" data-i="${i}">
      <span class="tag ${s.positive ? "" : "neg"}">${s.label}</span>
      <div class="row">
        <input class="slot-stat" placeholder="Escribí un stat…">
        <div class="unit" data-unit=""><input class="slot-value" type="number" step="0.1" placeholder="valor"></div>
      </div>
    </div>`).join("");
  const slotEls = [...document.querySelectorAll(".stat-slot")];

  // Selector con autocompletado: se escribe y la lista de abajo se filtra.
  // Opciones: [{value, label, hint?}]. `combo.value` es el value elegido ("" si no hay).
  const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  class Combo {
    constructor(input, onChange) {
      this.input = input; this.onChange = onChange; this.options = []; this.value = ""; this.active = 0;
      const wrap = document.createElement("div");
      wrap.className = "combo";
      input.replaceWith(wrap);
      this.list = document.createElement("div");
      this.list.className = "combo-list"; this.list.hidden = true;
      wrap.append(input, this.list);
      input.autocomplete = "off";
      input.addEventListener("input", () => { this.value = ""; this.active = 0; this.render(); this.onChange(""); });
      input.addEventListener("focus", () => { input.select(); this.active = 0; this.render(); });
      input.addEventListener("blur", () => this.commit());
      input.addEventListener("keydown", (e) => this.key(e));
      // mousedown (no click) para elegir antes de que el blur cierre la lista.
      this.list.addEventListener("mousedown", (e) => {
        e.preventDefault();
        const item = e.target.closest("[data-i]");
        if (item) this.pick(this.shown[item.dataset.i].value);
      });
    }
    setOptions(options) {
      this.options = options;
      if (this.value && !options.some((o) => o.value === this.value)) this.set("");
    }
    set(value) {
      this.value = value;
      this.input.value = this.options.find((o) => o.value === value)?.label ?? "";
    }
    pick(value) {
      this.set(value); this.list.hidden = true; this.onChange(value);
    }
    matches() {
      const q = norm(this.input.value.trim());
      if (!q || this.value) return this.options;  // sin texto nuevo: todas
      const scored = [];
      for (const o of this.options) {
        const l = norm(o.label), i = l.indexOf(q);
        if (i < 0) continue;
        scored.push([i === 0 ? 0 : l[i - 1] === " " ? 1 : 2, o]);  // empieza > empieza palabra > contiene
      }
      return scored.sort((a, b) => a[0] - b[0]).map(([, o]) => o);
    }
    render() {
      this.shown = this.matches().slice(0, 80);
      const q = this.value ? "" : this.input.value.trim();
      const mark = (label) => {
        if (!q) return esc(label);
        const i = norm(label).indexOf(norm(q));
        return i < 0 ? esc(label) : esc(label.slice(0, i)) + `<mark>${esc(label.slice(i, i + q.length))}</mark>` + esc(label.slice(i + q.length));
      };
      if (!this.value) this.active = Math.min(this.active, Math.max(this.shown.length - 1, 0));
      else this.active = Math.max(this.shown.findIndex((o) => o.value === this.value), 0);
      this.list.innerHTML = this.shown.length
        ? this.shown.map((o, i) => `<div class="combo-item ${i === this.active ? "active" : ""} ${o.value === this.value ? "selected" : ""}" data-i="${i}">
            <span>${mark(o.label)}</span>${o.hint ? `<small>${esc(o.hint)}</small>` : ""}</div>`).join("")
        : `<div class="combo-empty">Sin resultados</div>`;
      this.list.hidden = false;
      this.list.querySelector(".active")?.scrollIntoView({ block: "nearest" });
    }
    key(e) {
      if (this.list.hidden && ["ArrowDown", "ArrowUp"].includes(e.key)) { this.render(); e.preventDefault(); return; }
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        const n = this.shown.length;
        if (!n) return;
        this.active = (this.active + (e.key === "ArrowDown" ? 1 : n - 1)) % n;
        [...this.list.children].forEach((el, i) => el.classList.toggle("active", i === this.active));
        this.list.children[this.active].scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter" && !this.list.hidden) {
        e.preventDefault();
        if (this.shown[this.active]) this.pick(this.shown[this.active].value);
      } else if (e.key === "Escape" && !this.list.hidden) {
        e.preventDefault(); e.stopPropagation();  // que no cierre el modal
        this.list.hidden = true;
      } else if (e.key === "Tab" && !this.list.hidden && !this.value && this.input.value.trim() && this.shown[this.active]) {
        this.pick(this.shown[this.active].value);
      }
    }
    commit() {
      this.list.hidden = true;
      if (this.value) { this.set(this.value); return; }
      // Texto escrito sin elegir: vale si coincide exacto; si no, se borra.
      const exact = this.options.find((o) => norm(o.label) === norm(this.input.value.trim()));
      if (exact) this.pick(exact.value); else this.input.value = "";
    }
  }

  const weaponCombo = new Combo($("#f-weapon"), () => refreshSlots());
  const statCombos = slotEls.map((el) => new Combo(el.querySelector(".slot-stat"), () => refreshUnit(el)));

  const currentWeapon = () => weaponBySlug[weaponCombo.value];

  function refreshSlots() {
    const weapon = currentWeapon();
    const type = weapon?.type;
    statCombos.forEach((combo, i) => {
      combo.setOptions(catalog.stats
        .filter((s) => (!s.exclusiveTo.length || !type || s.exclusiveTo.includes(type)) && (SLOTS[i].positive || !s.positiveOnly))
        .map((s) => ({ value: s.slug, label: s.name, hint: UNIT[s.unit] })));
      refreshUnit(slotEls[i]);
    });
    $("#rd-info").textContent = weapon
      ? `${weapon.name} · ${weapon.type} · disposición ${weapon.disposition}`
      : "Para la referencia alcanza con el arma. Los stats y valores (tal como aparecen en el juego) son para publicar.";
  }

  function refreshUnit(el) {
    const meta = statBySlug[statCombos[slotEls.indexOf(el)].value];
    el.querySelector(".unit").dataset.unit = UNIT[meta?.unit] ?? "";
  }

  function readForm() {
    const weapon = currentWeapon();
    const attributes = slotEls.map((el, i) => {
      const slug = statCombos[i].value;
      if (!slug) return null;
      let value = parseFloat(el.querySelector(".slot-value").value);
      // Un negativo en % o segundos va con signo menos aunque lo escriban sin él.
      if (!SLOTS[i].positive && value > 0 && statBySlug[slug]?.unit !== "multiply") value = -value;
      return { url_name: slug, positive: SLOTS[i].positive, value };
    }).filter(Boolean);
    return {
      weapon, attributes,
      item: weapon && {
        weapon_url_name: weapon.slug, name: $("#f-name").value.trim(), attributes,
        mastery_level: $("#f-mr").value, mod_rank: $("#f-rank").value, re_rolls: $("#f-rolls").value,
        polarity: $("#f-polarity").value,
      },
    };
  }

  function setMode(existing) {
    editing = existing;
    $("#rd-title").innerHTML = existing ? `Referencia · ${rivenLabel(existing)}` : "Nuevo riven";
    $("#publish-title").textContent = existing ? "Actualizar precio del contrato" : "Publicar venta directa";
    $("#publish-go").textContent = existing ? "Actualizar precio" : "Publicar";
    $("#f-visible-wrap").hidden = !!existing;
    $("#f-note-wrap").hidden = !!existing;
    document.querySelectorAll(".grid-riven input, .grid-riven select, .slot-stat, .slot-value")
      .forEach((el) => (el.disabled = !!existing));
  }

  function openRiven(existing = null) {
    const wasEditing = editing !== null;
    setMode(existing);
    $("#confirm").hidden = true;
    $("#ref-section").hidden = true;
    $("#publish-step").textContent = "2";
    if (existing) {
      weaponCombo.set(existing.weapon);
      $("#f-name").value = existing.name;
      $("#f-polarity").value = existing.polarity;
      $("#f-mr").value = existing.mr; $("#f-rank").value = existing.rank; $("#f-rolls").value = existing.rolls;
      refreshSlots();
      const pos = existing.stats.filter((s) => s.positive), neg = existing.stats.filter((s) => !s.positive);
      [pos[0], pos[1], pos[2], neg[0]].forEach((s, i) => {
        statCombos[i].set(s?.slug ?? "");
        slotEls[i].querySelector(".slot-value").value = s?.value ?? "";
        refreshUnit(slotEls[i]);
      });
      $("#f-price").value = existing.price;
    } else if (wasEditing) {
      // Venía de mirar un contrato existente: empezar de cero.
      weaponCombo.set("");
      ["#f-name", "#f-note"].forEach((s) => ($(s).value = ""));
      $("#f-polarity").value = "madurai"; $("#f-mr").value = 8; $("#f-rank").value = 0; $("#f-rolls").value = 0;
      slotEls.forEach((el, i) => { statCombos[i].set(""); el.querySelector(".slot-value").value = ""; });
      $("#f-visible").checked = true;
      $("#f-price").value = "";
      refreshSlots();
    } else {
      refreshSlots();
    }
    $("#riven-dialog").showModal();
    if (existing) runReference(); else $("#f-weapon").focus();
  }

  async function runReference() {
    const weapon = currentWeapon();
    if (!weapon) { toast("Elegí un arma de la lista", true); $("#f-weapon").focus(); return; }
    $("#ref-go").disabled = true; $("#ref-go").textContent = "Buscando…";
    try {
      renderReference(weapon, await api().search(weapon.slug));
    } finally {
      $("#ref-go").disabled = false; $("#ref-go").textContent = "Ver precio de referencia";
    }
  }

  function renderReference(weapon, data) {
    $("#ref-section").hidden = false;
    $("#publish-step").textContent = "3";
    $("#ref-title").textContent = `Referencia · ${weapon.name} · las 7 más baratas de vendedores en juego`;
    $("#ref-note").textContent = data.maybe_incomplete
      ? "Puede faltar alguna: la búsqueda llegó al límite de resultados de warframe.market."
      : "";
    if (data.error) { $("#summary").innerHTML = ""; $("#results").innerHTML = `<div class="state error">${esc(data.error)}</div>`; return; }
    const rows = data.results;
    if (!rows.length) {
      $("#summary").innerHTML = "";
      $("#results").innerHTML = `<div class="state">No hay ventas directas de este arma de vendedores en juego ahora.</div>`;
      return;
    }
    const prices = rows.map((r) => r.price).sort((a, b) => a - b);
    const median = prices[Math.floor(prices.length / 2)];
    const avg = Math.round(prices.reduce((a, b) => a + b, 0) / prices.length);
    $("#summary").innerHTML = [["Mínimo", prices[0]], ["Mediana", median], ["Promedio", avg]]
      .map(([k, v]) => `<button class="chip" data-price="${v}" title="Usar como precio"><b>${v}p</b><span>${k} · usar</span></button>`).join("") +
      `<div class="chip"><b>${rows.length}</b><span>Comparables</span></div>`;
    $("#results").innerHTML = `<table class="ref-table">
      <tbody>${rows.map((r) => `<tr>
        <td class="price">${r.price}p</td>
        <td><a class="riven-name" style="font-size:13px" href="https://warframe.market/auction/${esc(r.id)}" target="_blank">${esc(r.name)}</a></td>
        <td><div class="stats">${r.stats.map(formatStat).join("")}</div></td>
        <td class="muted">${esc(r.rolls)} rolls · MR${esc(r.mr)}</td>
        <td>${esc(r.seller)} <span class="muted">· rep ${esc(r.reputation)}</span></td>
      </tr>`).join("")}</tbody></table>`;
  }

  $("#summary").addEventListener("click", (e) => {
    const chip = e.target.closest("[data-price]");
    if (!chip) return;
    $("#f-price").value = chip.dataset.price;
    $("#confirm").hidden = true;
  });
  $("#ref-go").addEventListener("click", runReference);

  // Publicar / actualizar: primer click muestra el resumen, el segundo confirma.
  $("#publish-go").addEventListener("click", () => {
    const price = parseInt($("#f-price").value, 10);
    if (!price || price < 1) { toast("Poné un precio", true); $("#f-price").focus(); return; }
    if (editing) {
      if (price === editing.price) { toast("Es el mismo precio que ya tiene"); return; }
      $("#confirm-text").innerHTML = `Cambiar el precio de ${rivenLabel(editing)}: <b>${editing.price}p → ${price}p</b>`;
    } else {
      const { weapon, item, attributes } = readForm();
      const pos = attributes.filter((a) => a.positive).length, neg = attributes.length - pos;
      if (!weapon) { toast("Elegí un arma de la lista", true); return; }
      if (pos < 2 || neg > 1) { toast("Un riven tiene 2 o 3 positivos y como mucho 1 negativo", true); return; }
      if (attributes.some((a) => Number.isNaN(a.value))) { toast("Falta el valor de algún stat", true); return; }
      if (!item.name) { toast("Falta el nombre del riven", true); $("#f-name").focus(); return; }
      $("#confirm-text").innerHTML = `Se publica en tu cuenta: ${esc(weapon.name)} <span style="text-transform:capitalize">${esc(item.name)}</span> · <b>${price}p</b> · ${$("#f-visible").checked ? "visible" : "oculto"}`;
    }
    $("#confirm").hidden = false;
    $("#confirm-ok").focus();
  });
  $("#confirm-back").addEventListener("click", () => ($("#confirm").hidden = true));
  $("#f-price").addEventListener("input", () => ($("#confirm").hidden = true));

  $("#confirm-ok").addEventListener("click", async () => {
    const price = parseInt($("#f-price").value, 10);
    $("#confirm-ok").disabled = true;
    try {
      if (editing) {
        // Optimista: se cierra el modal ya y la fila muestra el precio nuevo con spinner.
        const a = mine.find((x) => x.id === editing.id) ?? editing;
        $("#riven-dialog").close();
        runUpdate(a, { price }, `Precio actualizado: ${a.price}p → ${price}p`);
      } else {
        // Publicar no puede ser optimista (el id lo da la API): el botón muestra que está en curso.
        const { item } = readForm();
        $("#confirm-ok").innerHTML = `Publicando…${spinner}`;
        $("#confirm-back").disabled = true;
        const res = await api().create(item, price, $("#f-visible").checked, $("#f-note").value);
        if (res.error) { toast(`No se pudo publicar: ${res.error}`, true); return; }
        mine = [res.auction, ...mine];
        renderMine();
        toast(`Publicado: ${weaponName(res.auction.weapon)} ${res.auction.name} · ${price}p`);
        $("#riven-dialog").close();
      }
    } finally {
      $("#confirm-ok").disabled = false;
      $("#confirm-ok").textContent = "Confirmar";
      $("#confirm-back").disabled = false;
      $("#confirm").hidden = true;
    }
  });

  $("#fab").addEventListener("click", () => openRiven(null));
  $("#rd-x").addEventListener("click", () => $("#riven-dialog").close());

  // ---- Arranque ---------------------------------------------------------

  window.addEventListener("pywebviewready", async () => {
    try {
      catalog = await api().catalog();
    } catch (e) {
      toast(`No se pudo cargar el catálogo: ${e.message || e}`, true);
    }
    catalog.stats.forEach((s) => (statBySlug[s.slug] = s));
    catalog.weapons.forEach((w) => (weaponBySlug[w.slug] = w));
    weaponCombo.setOptions(catalog.weapons.map((w) => ({ value: w.slug, label: w.name, hint: w.type })));
    refreshSlots();
    loadMine();
  });
</script>
</body>
</html>
